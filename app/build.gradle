plugins {
    id 'com.android.application'
}

android {
    namespace 'com.puthi.reader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.puthi.reader'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('PUTHI_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PUTHI_KS_PASS')
                keyAlias System.getenv('PUTHI_KEY_ALIAS')
                keyPassword System.getenv('PUTHI_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('PUTHI_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // assets are already compressed; keep woff/pdf.js stored sensibly
    androidResources {
        noCompress 'woff', 'woff2'
    }

    lint {
        abortOnError false
    }
}
