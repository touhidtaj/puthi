<style>
@font-face{font-family:'Noto Serif Bengali';src:url(bn.woff) format('woff');font-weight:400 700;font-style:normal;unicode-range:U+0980-09FF,U+200C-200D;font-display:swap}
@font-face{font-family:'Noto Sans Arabic';src:url(ar.woff) format('woff');font-weight:400 700;font-style:normal;font-display:swap}
:root{
  --bg:#0c0c10;  --card:#1b1b23; --line:#ffffff14;
  --text:#f3f3f6; --muted:#9b9bab; --accent:#ff5a3c; --accent2:#ffb347;
  --sb-top:0px; --sb-bot:0px;
  --ui:"Noto Serif Bengali",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:var(--ui);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.sysbar,.navbar{display:none}
@media (min-width:560px) and (hover:hover) and (pointer:fine){
  body{display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 0,#2a1f2e 0,#0a0a0d 60%)}
  #device{width:412px;height:min(880px,calc(100vh - 28px));border-radius:38px;box-shadow:0 0 0 9px #17171c,0 0 0 11px #2b2b33,0 40px 90px #000b;--sb-top:30px;--sb-bot:22px}
  #device.imm{--sb-top:0px;--sb-bot:0px}
  .sysbar{display:flex;position:absolute;top:0;left:0;right:0;height:30px;padding:0 24px;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;z-index:70;pointer-events:none;background:linear-gradient(#0008,transparent)}
  .navbar{display:block;position:absolute;left:0;right:0;bottom:0;height:22px;z-index:70;pointer-events:none}
  .navbar:after{content:"";position:absolute;left:50%;bottom:7px;width:120px;height:4px;border-radius:4px;background:#fff8;transform:translateX(-50%)}
  #device.imm .sysbar,#device.imm .navbar{opacity:0;transition:opacity .3s}
}

/* ---------- Views ---------- */
.view{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--sb-top)}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(76px + var(--sb-bot));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.appbar{position:absolute;top:var(--sb-top);left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(#000b,transparent);transition:background .25s}
.appbar.solid{background:var(--bg);box-shadow:0 1px 0 var(--line)}
#boot{position:fixed;inset:0;z-index:9999;background:#0B0907;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
#boot svg{width:132px;height:auto;overflow:visible;filter:drop-shadow(0 0 28px #ff7a3d99)}
#boot rect{opacity:0;transform-box:fill-box;transform-origin:center}
#boot.first rect{animation:bpx .36s cubic-bezier(.2,.8,.3,1) forwards}
#boot.again rect{opacity:1}
@keyframes bpx{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
#boot .bt{font:700 40px/1.2 'Noto Serif Bengali',serif;color:#F3EBDD;opacity:0}
#boot.first .bt{animation:bfade .5s .95s forwards}
#boot.again .bt{opacity:1}
#boot .bs{font-size:13px;color:#A99E8D;opacity:0;text-align:center;padding:0 24px}
#boot.first .bs{animation:bfade .5s 1.2s forwards}
@keyframes bfade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#boot rect,#boot .bt,#boot .bs{animation:none!important;opacity:1!important}}
.logo{font-family:'Noto Serif Bengali',system-ui,sans-serif;font-weight:700;font-size:25px;color:#fff;display:flex;align-items:center;gap:8px}
.logo svg{display:block}
.abtns{display:flex;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;font-size:22px;border-radius:50%;color:var(--text)}
.ib:active{background:#ffffff1c}

/* Hero */
.hero{position:relative;height:clamp(380px,50vh,440px);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 22px 22px}
/*GREET*/.greet{display:flex;align-items:flex-start;gap:10px;padding:calc(var(--sb-top,0px) + 68px) 16px 16px;text-align:start}
.greet .gdot{flex:none;width:7px;height:7px;margin-top:.55em;background:#ff7a3d;box-shadow:0 0 10px #ff7a3d99;border-radius:1px}
.greet span{font-family:var(--ui);font-size:15px;line-height:1.5;font-weight:500;color:#cfc8bb;letter-spacing:0;max-width:34ch}
.hero .bd{position:absolute;inset:0;background-image:radial-gradient(120% 70% at 50% 18%,#ff5a3c33 0,#ff5a3c14 38%,transparent 70%),linear-gradient(180deg,#17120f 0,#0c0c10 100%)!important;filter:none;opacity:1;transform:none}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0c0c1066 0,#0c0c1033 30%,#0c0c10e6 78%,#0c0c10 100%)}
.hero>*{position:relative;z-index:1}
.hero .poster{width:36%;max-width:150px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;object-position:top;box-shadow:0 24px 50px #000a,0 0 0 1px #ffffff1a;margin-bottom:16px;background:var(--card)}
.hero .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);font-weight:700}
.hero h1{margin:6px 0 4px;font-size:25px;line-height:1.1;text-align:center;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.hero .meta{color:#d0d0da;text-shadow:0 1px 8px #000a;font-size:13px;margin-bottom:14px;text-align:center}
.hero .btns{display:flex;gap:10px;width:100%;max-width:340px}
.btn{flex:1;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.005em}
.btn.pri{background:#fff;color:#000}.btn.pri:active{background:#ddd}
.btn.sec{background:#ffffff26;color:#fff}.btn.sec:active{background:#ffffff40}
.btn.acc{background:var(--accent);color:#fff}
.btn.danger{background:#ff3b3022;color:#ff7a68}

/* Rows */
.row{margin-top:22px}
.row h2{margin:0 16px 10px;font-size:17px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.row h2 small{font-size:12px;color:var(--muted);font-weight:500}
.track{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:0 16px}
.track::-webkit-scrollbar{display:none}
.track.drag{scroll-snap-type:none;cursor:grabbing}
.card{flex:none;width:112px;scroll-snap-align:start;cursor:pointer;transition:transform .2s;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .cv{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);box-shadow:0 8px 20px #0007,0 0 0 1px #ffffff12}
.card .cv img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none;-webkit-user-drag:none}
.card .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.card .pgbg{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0009}
.card .fv{position:absolute;top:6px;left:6px;font-size:14px;color:#ff6b81;filter:drop-shadow(0 1px 2px #000a)}
.card .fv svg{fill:currentColor}
.card .mo::after{content:'';position:absolute;inset:-9px}
.card .mo{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#000a;display:grid;place-items:center;font-size:15px;opacity:.85}
.card .ct{margin:6px 2px 0;font-size:12px;line-height:1.25;color:#d6d6de;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (hover:hover){.card:hover{transform:scale(1.06);z-index:3}}
.card.wide{width:150px}

.empty{margin:80px 30px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:14px 0 6px}

/* Bottom nav */
.bnav{position:absolute;left:0;right:0;bottom:0;padding-bottom:var(--sb-bot);height:calc(60px + var(--sb-bot));display:flex;background:linear-gradient(transparent,#0c0c10 35%);z-index:25;border-top:1px solid var(--line);background:#0c0c10f2;backdrop-filter:blur(12px)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600}
.bnav button svg{font-size:23px}
.bnav button.on{color:#fff}
.bnav button.on svg{color:var(--accent)}

/* Search */
.sbox{margin:66px 16px 6px;position:relative}
.sbox input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px 0 42px;font:inherit;font-size:16px;outline:none}
.sbox input:focus{border-color:#ffffff40}
.sbox svg{position:absolute;left:13px;top:13px;font-size:20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:12px 16px}
.grid .card{width:auto}
.ph{padding:6px 16px 0;color:var(--muted);font-size:13px}

/* Notebook */
.nb{padding:70px 16px 0}
.nb h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.nb .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.nb .tools{display:flex;gap:8px;margin-bottom:18px}
.nb .tools .btn{height:38px;font-size:13px;flex:none;padding:0 14px}
.bk{margin-bottom:22px}
.bk>header{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.bk>header img{width:34px;aspect-ratio:2/3;object-fit:cover;object-position:top;border-radius:3px}
.bk>header b{font-size:15px;display:block}.bk>header span{font-size:12px;color:var(--muted)}

.item{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--card);margin-bottom:7px;cursor:pointer;text-align:start;width:100%}
.item:active{background:#262631}
.item .dot{flex:none;width:6px;align-self:stretch;border-radius:3px;background:var(--c,#ffd84a)}
.item .dot.bm{background:var(--accent)}
.item .bd{flex:1;min-width:0}
.item .q{font-size:13.5px;line-height:1.4;color:#e8e8ee}
.item .q.hlq{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c) 45%,transparent) 55%)}
.item .cm{font-size:12.5px;color:#c4c4d0;margin-top:5px;padding-left:9px;border-left:2px solid #ffffff30;white-space:pre-wrap}
.item .mt{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center}
.item .rm{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:16px}
.item .rm:active{background:#ffffff1a;color:#ff7a68}

/* Sheet */
#sheetWrap{position:absolute;inset:0;z-index:90;display:none}
#sheetWrap.on{display:block}
#sheetWrap .backdrop{position:absolute;inset:0;background:#000a;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;background:#1a1a22;border-radius:26px 26px 0 0;padding:8px 18px calc(18px + var(--sb-bot));overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px #0008}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#ffffff33;margin:2px auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px;letter-spacing:-.01em}
.sheet p.s{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45}
.sheet textarea{width:100%;min-height:130px;border-radius:12px;border:1px solid var(--line);background:#101016;color:var(--text);padding:12px;font:inherit;font-size:15px;line-height:1.5;resize:vertical;outline:none}
.sheet textarea:focus{border-color:#ffffff44}
.sheet .quote{font-family:var(--serif);font-size:14px;line-height:1.5;padding:8px 12px;border-left:3px solid var(--c,#ffd84a);background:#ffffff0a;border-radius:0 8px 8px 0;margin-bottom:12px;color:#dcdce6;max-height:90px;overflow:auto}
.sheet .acts{display:flex;gap:10px;margin-top:12px}
.sheet .acts .btn{height:44px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 6px;font-size:15px;border-bottom:1px solid var(--line);text-align:start}
.opt:last-child{border:0}
.opt svg{font-size:21px;color:var(--muted)}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.opt.dg{color:#ff7a68}.opt.dg svg{color:#ff7a68}
.bkhead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.bkhead img{width:56px;aspect-ratio:2/3;object-fit:cover;object-position:top;border-radius:5px;box-shadow:0 4px 14px #0008}
.bkhead b{font-size:16px;line-height:1.2;display:block}.bkhead span{color:var(--muted);font-size:12px;display:block;margin-top:3px;word-break:break-all}
.swrow{display:flex;gap:10px;margin:12px 0 2px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid #ffffff22;flex:none;position:relative;overflow:hidden}
.sw.on{box-shadow:0 0 0 2px #1a1a22,0 0 0 4px #fff}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:20px;background:#ffffff14;font-size:12.5px;font-weight:600}
.chip.on{background:#fff;color:#000}

/* Overlay (scan) */
#scan{position:absolute;inset:0;z-index:95;background:radial-gradient(600px 400px at 50% 20%,#2a1620,#0c0c10 70%);display:none;flex-direction:column;padding:calc(var(--sb-top) + 60px) 26px 40px}
#scan.on{display:flex}
#scan h2{margin:20px 0 6px;font-size:24px;letter-spacing:-.02em}
#scan .rad{width:92px;height:92px;border-radius:50%;margin:0 auto;position:relative;border:2px solid #ffffff22;display:grid;place-items:center;font-size:34px;color:var(--accent)}
#scan .rad:before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite}
#scan.done .rad:before{animation:none;border-color:var(--accent)}
#scan .bar{height:4px;border-radius:2px;background:#ffffff1a;margin:14px 0;overflow:hidden}
#scan .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#scan .log{flex:1;overflow:hidden;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8f8fa0;display:flex;flex-direction:column;justify-content:flex-end;mask-image:linear-gradient(transparent,#000 40%)}
#scan .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scan .log .f{color:#8ee6a0}
#scan .sub{color:var(--muted);font-size:14px;text-align:center}

/* Toast */
#toast{position:absolute;left:50%;bottom:calc(90px + var(--sb-bot));transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 16px;border-radius:24px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:88%;text-align:center;box-shadow:0 8px 24px #0008}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Reader ---------- */
#reader{position:absolute;inset:0;z-index:60;display:none;background:#1b1b1f;overflow:hidden}
#reader.on{display:block}
#reader.dark{background:#000}
.scroller{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 0 40px;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-x pan-y;scroll-behavior:auto}
.scroller::-webkit-scrollbar{display:none}
.pages{display:flex;flex-direction:column;align-items:flex-start;min-width:100%;width:max-content}
.page{position:relative;background:#fff;margin:0 auto 6px;flex:none;box-shadow:0 1px 6px #0006;isolation:isolate;overflow:hidden}
#reader.dark .page{background:#0e0e11;box-shadow:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#reader.dark .page canvas{filter:invert(.9) hue-rotate(180deg) contrast(.92)}
.page .ldr{position:absolute;inset:0;display:grid;place-items:center;color:#0003;font-size:42px;font-weight:800}
.hl,.nt{position:absolute;inset:0;pointer-events:none}
.hl .r{position:absolute}
.hl .t-hl{background:var(--c);mix-blend-mode:multiply;opacity:.78;border-radius:2px}
#reader.dark .hl .t-hl{mix-blend-mode:normal;opacity:.34}
.hl .t-ul{box-shadow:inset 0 -2.5px 0 var(--c)}
.hl .t-st{background:linear-gradient(transparent calc(50% - 1.2px),var(--c) calc(50% - 1.2px),var(--c) calc(50% + 1.2px),transparent calc(50% + 1.2px))}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0 0}
.textLayer ::selection,.textLayer::selection{background:rgba(70,140,255,.38);color:transparent}
.nt .sticky{position:absolute;width:30px;height:30px;margin:-4px 0 0 -4px;pointer-events:auto;display:grid;place-items:center;background:var(--c);color:#3a2d00;border-radius:3px 3px 12px 3px;box-shadow:0 3px 8px #0006,inset 0 -8px 0 #0000001a;font-size:15px;transform:rotate(-4deg);transition:transform .15s}
.nt .sticky:active{transform:scale(1.15) rotate(0)}
.rmk{position:absolute;top:58px;right:8px;pointer-events:auto;background:#2b2210;color:#ffd84a;border:1px solid #ffd84a66;border-radius:14px;padding:3px 9px 3px 7px;font-size:11px;font-weight:700;display:none;align-items:center;gap:5px;box-shadow:0 2px 8px #0005;z-index:4}
.rmk.on{display:flex}
.rmk svg{font-size:12px}

.ovl{position:absolute;left:0;right:0;z-index:30;display:flex;justify-content:space-between;gap:10px;padding:0 12px;pointer-events:none;transition:transform .28s cubic-bezier(.3,.8,.3,1),opacity .28s}
.ovl>*{pointer-events:auto}
.ovl.top{top:calc(var(--sb-top) + 10px);transform:translateY(-130%);opacity:0}
.ovl.bot{bottom:calc(var(--sb-bot) + 12px);transform:translateY(140%);opacity:0;flex-direction:column;align-items:center}
#reader.ui .ovl.top,#reader.ui .ovl.bot{transform:none;opacity:1}
.pill{display:flex;align-items:center;background:#16161cdd;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid #ffffff1c;border-radius:26px;box-shadow:0 8px 30px #0008;color:#fff}
#reader:not(.dark) .pill{background:#fffffff0;color:#111;border-color:#0001}
.pill .ib{width:44px;height:44px;font-size:20px;color:inherit}
.pill .ib.on{color:var(--accent)}
.pill .ib.on svg{fill:currentColor}
.ovl.top>.pill:first-child{min-width:0;flex:0 1 auto}.ovl.top>.pill:last-child{flex:none}
.ttl{min-width:0;max-width:max(70px,calc(100vw - 310px));padding:0 14px 0 2px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:560px){.ttl{max-width:150px}}
.slidepill{width:100%;max-width:520px;padding:8px 14px 8px 16px;flex-direction:column;align-items:stretch;border-radius:22px;gap:2px}
.srow{display:flex;align-items:center;gap:12px}
.srow .pn{font-size:12.5px;font-weight:700;min-width:62px;text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
.srow .sl{position:relative;flex:1;height:30px;display:flex;align-items:center}
.srow input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;position:relative;z-index:2}
.srow input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),#8886 var(--p,0%))}
.srow input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#8886}
.srow input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.srow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px #0008}
.srow input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ticks{position:absolute;left:9px;right:9px;top:50%;height:0;z-index:1;pointer-events:none}
.ticks i{position:absolute;top:-14px;width:8px;height:10px;margin-left:-4px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:-2px}
.tools .tb{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:18px;font-size:12px;font-weight:700;opacity:.9}
.tools .tb svg{font-size:16px}
.tools .tb:active,.tools .tb.on{background:#ffffff22}
#reader:not(.dark) .tools .tb:active,#reader:not(.dark) .tools .tb.on{background:#0001}
.tools .tb.on{color:var(--accent)}
.tools .zm{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:700}
.tools .zm button{width:34px;height:32px;display:grid;place-items:center;font-size:17px;border-radius:50%}
.tools .zm button:active{background:#ffffff22}
.hair{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);z-index:5;width:0;opacity:.8;transition:opacity .3s}
#reader.ui .hair{opacity:0}
.pagebadge{position:absolute;left:50%;top:calc(var(--sb-top) + 14px);transform:translateX(-50%);background:#000b;color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px;z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
.pagebadge.on{opacity:1}
.placing{position:absolute;top:calc(var(--sb-top) + 72px);left:50%;transform:translateX(-50%);z-index:40;background:#ffd84a;color:#3a2d00;font-weight:700;font-size:13px;padding:9px 14px;border-radius:22px;box-shadow:0 8px 20px #0006;display:none;align-items:center;gap:8px}
.placing.on{display:flex}
#reader.placing-mode .scroller{cursor:crosshair}

/* floating selection toolbar */
.seltool{position:absolute;z-index:45;background:#1c1c24f2;border:1px solid #ffffff22;border-radius:16px;padding:7px;box-shadow:0 12px 36px #000a;display:none;flex-direction:column;gap:7px;width:max-content;max-width:94%;backdrop-filter:blur(12px);color:#fff;touch-action:none}
.seltool.on{display:flex;animation:pop .14s ease-out}
.seltool .r1,.seltool .r2{display:flex;align-items:center;gap:6px}
.seltool .seg{display:flex;background:#ffffff14;border-radius:10px;padding:2px}
.seltool .seg button,.seltool .act{width:34px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:17px;color:#d8d8e2}
.seltool .seg button.on{background:#fff;color:#000}
.seltool .act:active{background:#ffffff22}
.seltool .sep{width:1px;height:20px;background:#ffffff22;margin:0 2px}
.seltool .sw{width:28px;height:28px;border-width:2px}
.seltool .cmt{font-size:12.5px;max-width:240px;line-height:1.4;color:#d8d8e2;padding:2px 6px 0;max-height:70px;overflow:auto;white-space:pre-wrap}

/* Color picker */
#picker{position:absolute;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:#000b;padding:16px}
#picker.on{display:flex}
.pk{width:100%;max-width:340px;max-height:100%;overflow:auto;background:#242427;border-radius:26px;padding:20px 20px 18px;box-shadow:0 20px 60px #000c;animation:pop .16s;color:#eee;scrollbar-width:none}
.pk header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pk h4{margin:0;font-size:20px;font-weight:600}
.pk .cmp{display:flex;gap:8px}.pk .cmp i{width:40px;height:28px;border-radius:8px;border:1px solid #ffffff2a}
.pk .wheel{position:relative;width:88%;margin:0 auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.pk canvas{position:absolute;inset:0;width:100%;height:100%}
.pk .knob{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3.5px solid #fff;box-shadow:0 0 0 1px #0005,inset 0 0 0 1px #0004;pointer-events:none}
.pk .lrow{display:flex;align-items:center;gap:12px;margin:18px 0 16px}
.pk .lrow .e{width:32px;height:32px;border-radius:50%;border:2px solid #ffffff44;flex:none}
.pk .lsl{position:relative;flex:1;height:32px;touch-action:none}
.pk .lsl .trk{position:absolute;left:0;right:0;top:12px;height:8px;border-radius:4px}
.pk .lsl .th{position:absolute;top:3px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0009;pointer-events:none}
.pk .hexrow{display:flex;gap:12px;align-items:center}
.pk .cur{width:62px;height:62px;border-radius:50%;border:3px solid #fff;flex:none}
.pk input.hex{flex:1;min-width:0;height:56px;border-radius:14px;border:0;background:#303035;color:#eee;font:600 22px ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 16px;text-transform:uppercase;outline:none}
.pk hr{border:0;border-top:1px solid #ffffff1a;margin:16px 0 12px}
.pk .rl{font-size:14px;color:#9a9aa3;margin-bottom:10px}
.pk .rec{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;direction:ltr}
.pk .rec button{aspect-ratio:1;min-width:0;border-radius:6px;border:1px solid #ffffff26;background:var(--c);padding:0}
.pk .rec button.on{box-shadow:0 0 0 2px #242427,0 0 0 3.5px #fff}
.pk .btns{display:flex;gap:10px;margin-top:16px}
.pk .btns .btn{height:46px}
/* keyboard open */
body.kb .sheet{max-height:100%;padding-bottom:12px}
body.kb .sheet textarea{min-height:84px}
body.kb .bnav{display:none}
#tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);background:#000c;color:#fff;padding:7px 13px;border-radius:16px;font-size:12px;font-weight:600;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:62;white-space:nowrap;border:1px solid #ffffff22}
#tip.on{opacity:.92;transform:translate(-50%,-50%)}
.srow .pn{display:flex;align-items:center;gap:6px;min-width:0;text-align:left;font-size:13px;font-weight:700;opacity:1}
.srow .pn input{width:46px;height:30px;border-radius:9px;border:1px solid #8885;background:#8882;color:inherit;text-align:center;font:inherit;font-weight:700;outline:none;padding:0;-moz-appearance:textfield}
.srow .pn input:focus{border-color:var(--accent);background:#8883}
.srow .pn span{opacity:.7;font-variant-numeric:tabular-nums}
.rload{position:absolute;inset:0;z-index:28;display:none;place-items:center;background:#0c0c10 center/cover no-repeat}
.rload:before{content:"";position:absolute;inset:0;backdrop-filter:blur(28px) brightness(.45);-webkit-backdrop-filter:blur(28px) brightness(.45)}
.rload i{position:relative;width:34px;height:34px;border-radius:50%;border:3px solid #ffffff2a;border-top-color:#fff;animation:spin .8s linear infinite}
#reader.loading .rload{display:grid}
.page{contain:layout paint style}
body.l-bn .hero .tag,body.l-ar .hero .tag{letter-spacing:0;font-size:13px}
body.l-bn{--ui:"Noto Serif Bengali",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
body.l-ar{--ui:"Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.l-bn .hero h1,body.l-bn .row h2,body.l-bn .sheet h3,body.l-bn .nb h1,body.l-bn #scan h2,body.l-bn .empty h2{line-height:1.4;letter-spacing:0}
body.l-bn .card .ct,body.l-ar .card .ct{line-height:1.45}

#reader{direction:ltr}
#reader .sheet,.sheet{direction:inherit}
.opt .ck{margin-inline-start:auto;color:var(--accent);font-size:20px}
.sw.custom{position:relative;background:#ffffff0f;border:1.5px solid #ffffff3d}
.sw.custom:before,.sw.custom:after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.7px;background:#fff;border-radius:1px;transform:translate(-50%,-50%);opacity:.9}
.sw.custom:after{transform:translate(-50%,-50%) rotate(90deg)}
.sw.custom.filled:before,.sw.custom.filled:after{display:none}
.seltool .sw.custom{border-color:#ffffff55}
.scroller,.textLayer{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.textLayer span{cursor:text}
.sv{position:absolute;inset:0;pointer-events:none}
.sv .sr{position:absolute;background:rgba(77,148,255,.34);border-radius:2px}
#selh .hd{position:absolute;width:44px;height:50px;margin-left:-22px;display:none;touch-action:none;z-index:46}
#selh:not(.on) .hd{display:none!important}
#selh .hd:before{content:"";position:absolute;left:50%;top:2px;width:2px;height:12px;margin-left:-1px;background:#4d94ff}
#selh .hd:after{content:"";position:absolute;left:50%;top:13px;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;background:#4d94ff;box-shadow:0 2px 8px #0008,0 0 0 2px #fff}
.nt .sticky[data-note]{touch-action:none;cursor:grab}
.nt .sticky.lift{transform:scale(1.28) rotate(0)!important;box-shadow:0 12px 26px #000a;z-index:6;transition:none;cursor:grabbing}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  setTimeout(()=>{
    try{const blob=kind==='pdf'?buildPdf(groups):buildDocx(groups);const name=(id&&books[0]?books[0].title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-'):'puthi-notebook')+'-notes.'+(kind==='pdf'?'pdf':'docx');
      if(NATIVE){const fr=new FileReader();fr.onload=()=>{const ok=NATIVE.saveFile(name,blob.type||'application/octet-stream',String(fr.result).split(',')[1]);toast(ok?tr('savedT',{n:name}):tr('expFail'),2200)};fr.readAsDataURL(blob);return}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast(tr('savedT',{n:name}),2200)}
    catch(e){console.error(e);toast(tr('expFail'))}
  },60);
}

/* ---- color picker ---- */
const PK={open:false};
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return {h,s:mx?d/mx:0,v:mx}}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;return {l,s:d?d/(1-Math.abs(2*l-1)):0}}
function hsl2rgb(h,s,l){const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r,g,b;[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return [r+m,g+m,b+m].map(v=>Math.round(v*255))}
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
function openPicker(initial,onApply){
  const el=$('#picker');initial=/^#[0-9a-f]{6}$/i.test(initial||'')?initial.toLowerCase():'#c58bff';
  const st={h:0,s:1,l:.5};
  const setHex=(hex,keepH)=>{const [r,g,b]=hex2rgb(hex),hl=rgb2hsl(r,g,b),hv=rgb2hsv(r,g,b);if(!(keepH&&hv.s<.02))st.h=hv.h;st.l=hl.l;st.s=hl.s};
  setHex(initial);
  const rec=(P.recent&&P.recent.length?P.recent:['#ffd84a','#6fe08a','#ff8ab3','#6cc0ff','#c58bff','#ff9f43','#ff5a3c','#2ec4b6','#ffffff','#000000']).slice(0,10);
  el.innerHTML=`<div class="pk"><header><h4>${tr('colors')}</h4><div class="cmp"><i style="background:${initial}"></i><i id="pkNew"></i></div></header>
  <div class="wheel" id="pkW"><canvas id="pkRing"></canvas><div class="knob" id="kH"></div></div>
  <div class="lrow"><span class="e" style="background:#000"></span><div class="lsl" id="pkL"><div class="trk" id="pkT"></div><div class="th" id="pkTh"></div></div><span class="e" style="background:#fff"></span></div>
  <div class="hexrow"><div class="cur" id="pkCur"></div><input class="hex" id="pkHex" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="characters"></div>
  <hr><div class="rl">${tr('recentC')}</div><div class="rec">${rec.map(c=>`<button style="--c:${c}" data-c="${c}" aria-label="${c}"></button>`).join('')}</div>
  <div class="btns"><button class="btn sec" id="pkNo">${tr('cancel')}</button><button class="btn acc" id="pkOk">${tr('apply')}</button></div></div>`;
  el.classList.add('on');PK.open=true;
  const W=$('#pkW'),ringC=$('#pkRing');
  let size=0,R0=0,R1=0,cx=0,cy=0;const dpr=Math.min(devicePixelRatio||1,2);
  const cur=()=>rgb2hex(...hsl2rgb(st.h,st.s,st.l));
  function geom(){size=W.clientWidth;ringC.width=ringC.height=Math.round(size*dpr);cx=cy=size/2;R0=size/2-1;R1=R0-size*.19;
    const c=ringC.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);let g='#f0f';
    if(c.createConicGradient){g=c.createConicGradient(0,cx,cy);for(let i=0;i<=24;i++)g.addColorStop(i/24,`hsl(${i===24?0:Math.round((1-i/24)*360)%360},100%,50%)`)}
    c.beginPath();c.arc(cx,cy,R0,0,Math.PI*2);c.arc(cx,cy,R1,0,Math.PI*2,true);c.fillStyle=g;c.fill('evenodd')}
  function sync(skipHex){
    const hex=cur();const a=-st.h*Math.PI/180,rm=(R0+R1)/2,kH=$('#kH');
    kH.style.left=(cx+Math.cos(a)*rm)+'px';kH.style.top=(cy+Math.sin(a)*rm)+'px';kH.style.background=hex;
    $('#pkT').style.background=`linear-gradient(90deg,#000,${rgb2hex(...hsl2rgb(st.h,st.s,.5))},#fff)`;$('#pkTh').style.left=(st.l*100)+'%';
    $('#pkNew').style.background=hex;$('#pkCur').style.background=hex;
    if(!skipHex)$('#pkHex').value=hex.toUpperCase();
    $$('.rec button',el).forEach(bt=>bt.classList.toggle('on',bt.dataset.c.toLowerCase()===hex));
  }
  geom();sync();
  const pos=(e,node)=>{const r=node.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  let mode=false;
  const wheelMove=e=>{const [x,y]=pos(e,W);st.h=((-Math.atan2(y-cy,x-cx)*180/Math.PI)+360)%360;if(st.s<.3)st.s=1;if(st.l<.08||st.l>.92)st.l=.5;sync()};
  W.addEventListener('pointerdown',e=>{const [x,y]=pos(e,W);if(Math.hypot(x-cx,y-cy)<R1-10)return;mode=true;W.setPointerCapture(e.pointerId);wheelMove(e);e.preventDefault()});
  W.addEventListener('pointermove',e=>{if(mode)wheelMove(e)});
  ['pointerup','pointercancel'].forEach(ev=>W.addEventListener(ev,()=>mode=false));
  const L=$('#pkL');let ld=false;
  const lMove=e=>{const [x]=pos(e,L);st.l=clamp(x/L.clientWidth,0,1);if(st.s<.3)st.s=1;sync()};
  L.addEventListener('pointerdown',e=>{ld=true;L.setPointerCapture(e.pointerId);lMove(e);e.preventDefault()});
  L.addEventListener('pointermove',e=>{if(ld)lMove(e)});
  ['pointerup','pointercancel'].forEach(ev=>L.addEventListener(ev,()=>ld=false));
  $('#pkHex').addEventListener('input',e=>{let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){setHex(v,true);sync(true)}});
  $$('.rec button',el).forEach(bt=>bt.onclick=()=>{setHex(bt.dataset.c,true);sync()});
  const close=()=>{el.classList.remove('on');el.innerHTML='';PK.open=false};
  $('#pkNo').onclick=close;el.onclick=e=>{if(e.target===el)close()};
  $('#pkOk').onclick=()=>{const c=cur();close();onApply(c)};
}

function recentPush(c){P.recent=[c,...(P.recent||[]).filter(x=>x.toLowerCase()!==c.toLowerCase())].slice(0,10);P.custom=c;savePrefs()}
function refreshLists(b,page){
  if(R.open&&R.book===b){drawTicks();updateNav();for(let p=1;p<=b.pages;p++)renderAnn(p);if($('#sheetWrap').classList.contains('on'))listSheet()}
  else renderNotes(),paintIcons();
}
$('#fPdf').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)importFiles(f,tr('importing'));e.target.value=''});

window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files,tr('importing'))});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(!R.open){if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card'))openReader(e.target.dataset.id);return}
  const k=e.key;
  if(k==='Escape'){if($('#sheetWrap').classList.contains('on'))closeSheet();else if(ST.classList.contains('on'))hideSel();else if(R.placing){R.placing=false;RD.classList.remove('placing-mode');$('#placing').classList.remove('on')}else closeReader()}
  else if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.shiftKey)){if(k!==' ')e.preventDefault();if(k!==' ')scrollToPage(Math.min(R.book.pages,R.cur+1),true)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();scrollToPage(Math.max(1,R.cur-1),true)}
  else if(k==='b')$('#bmBtn').click();else if(k==='d')$('[data-act=r-dark]').click();else if(k==='m')setUI(!R.ui);
});
setInterval(()=>{const d=new Date();$('#clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')},15000);

/* keyboard-aware layout (mobile) */
(function(){const vv=window.visualViewport;let base=0,lastW=0;
  function fit(){const d=$('#device');if(innerWidth!==lastW){lastW=innerWidth;base=0}if(matchMedia('(min-width:560px) and (hover:hover) and (pointer:fine)').matches){d.style.height='';d.style.transform='';document.body.classList.remove('kb');return}
    if(!vv)return;base=Math.max(base,vv.height);d.style.height=vv.height+'px';d.style.transform=vv.offsetTop?'translateY('+vv.offsetTop+'px)':'';
    document.body.classList.toggle('kb',vv.height<base-120);if(window.scrollY)window.scrollTo(0,0)}
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
  let rzT=0,rzT2=0;const settle=()=>{base=0;fit();relayoutReader()};
  window.addEventListener('resize',()=>{clearTimeout(rzT);clearTimeout(rzT2);rzT=setTimeout(settle,120);rzT2=setTimeout(settle,500)});
  window.addEventListener('orientationchange',()=>{base=0;setTimeout(settle,150);setTimeout(settle,600)});
  document.addEventListener('focusin',e=>{const t=e.target;if(t.tagName==='TEXTAREA'||t.tagName==='INPUT')setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},320)});
  fit();})();

/* =============== boot =============== */
async function endBoot(){const b=$('#boot');if(!b)return;const min=window.__bootFirst?1700:350;await sleep(Math.max(0,min-(Date.now()-window.__bootStart)));try{localStorage.setItem('puthi.booted','1')}catch(e){}b.classList.add('out');setTimeout(()=>b.remove(),420)}

  applyLang();paintIcons();

  const saved=await DB.all();
  saved.forEach(b=>{if(badTitle(b.title)||/\.pdf$/i.test(b.title)){b.title=cleanTitle(b.title,b.name);DB.put('books',b)}b.bookmarks=b.bookmarks||[];b.notes=b.notes||[];b.remarks=b.remarks||{};S.books.push(b);S.byId.set(b.id,b)});

    for(const b of S.books.filter(b=>demo.includes(b.name)&&b.path.indexOf('/storage/emulated/0/')===0)){S.books=S.books.filter(x=>x!==b);S.byId.delete(b.id);await DB.del('books',b.id);await DB.del('files',b.id)}renderTab()}

  endBoot();
  if(NATIVE)window.__puthi.ready=true;
  if(location.hash==='#debug')window.__folio={S,R,openReader,importFiles};
  document.body.dataset.ready='1';
})();
